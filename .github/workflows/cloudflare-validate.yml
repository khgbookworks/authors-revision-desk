name: Validate Cloudflare migration

on:
  push:
    branches:
      - cloudflare-migration
      - formatter-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check functions/api/health.js
          node --check functions/api/_shared.js
          node --check functions/api/projects/index.js
          node --check "functions/api/projects/[id].js"
          node --check "functions/api/projects/[id]/shares.js"
          node --check "functions/api/reviews/[shareId].js"
          node --check review.js
          node --check review.js
          node --check scripts/validate-backend.mjs
          node scripts/validate-backend.mjs
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          connection.executescript(Path("migrations/0001_manuscript_workspace.sql").read_text())
          tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"projects", "project_versions", "project_shares", "review_decisions", "editor_submissions", "ai_usage"}
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing database tables: {sorted(missing)}")
          if connection.execute("PRAGMA foreign_key_check").fetchall():
              raise SystemExit("Database migration contains foreign-key violations.")
          print("D1 migration SQL verified with SQLite.")
          PY
          node --check functions/api/ai-edit.js
          node --check functions/api/beta-read.js
          node --check "functions/api/beta-read/book.js"
          node --check "functions/api/google-docs/[action].js"
          test -s migrations/0001_manuscript_workspace.sql
      - name: Build static application
        run: npm run build
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/review.html
          test -s dist/review.css
          test -s dist/review.js
      - name: Verify formatter controls and exports
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("index.html", "utf8");
          const app = readFileSync("app.js", "utf8");
          const ids = [
            "formatTitle", "formatAuthor", "formatSubtitle", "formatCopyright",
            "formatDedication", "formatAcknowledgements", "formatGutter",
            "formatFontSize", "formatLineSpacing", "formatIndent", "formatMargin",
            "includeRunningHeaders", "bookType", "trimSize", "formatFont",
            "chapterStyle", "includeFrontMatter", "includeToc", "includePageNumbers",
            "formatQualityReport"
          ];
          const missing = ids.filter((id) => !html.includes(`id="${id}"`));
          if (missing.length) throw new Error(`Missing formatter controls: ${missing.join(", ")}`);
          const requiredCode = [
            "function formatBookMarkup", "function formatBookCss", "async function exportDocx",
            "function sanitizeRichHtml", "function richHtmlToDocxBlocks", "function runFormatterQualityChecks",
            "function exportEpub", 'properties="nav"', "@page:left", "@page:right",
            '$("[data-download-docx]").onclick = exportDocx'
          ];
          const absent = requiredCode.filter((token) => !app.includes(token));
          if (!html.includes("data-download-docx")) absent.push("DOCX download button");
          if (!html.includes("data-format-qa")) absent.push("formatter quality check button");
          if (absent.length) throw new Error(`Missing formatter implementation: ${absent.join(", ")}`);
          const backendFiles = [
            "functions/api/_shared.js",
            "functions/api/projects/index.js",
            "functions/api/projects/[id].js",
            "functions/api/projects/[id]/shares.js",
            "functions/api/reviews/[shareId].js",
            "review.html", "review.css", "review.js",
            "migrations/0001_manuscript_workspace.sql"
          ];
          for (const path of backendFiles) {
            const { existsSync } = await import("node:fs");
            if (!existsSync(path)) throw new Error(`Missing backend file: ${path}`);
          }
          const backend = readFileSync("functions/api/projects/[id].js", "utf8");
          for (const token of ["authorizeOwner", "loadProjectSnapshot", "project_versions"]) {
            if (!backend.includes(token)) throw new Error(`Missing persistent backend behavior: ${token}`);
          }
          console.log("Formatter controls, exports, and backend routes verified.");
          NODE
